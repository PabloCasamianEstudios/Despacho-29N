<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Tráiler Despacho 29-N</title>
<style>
@font-face { font-family: "Ultra"; src: url("../fonts/Ultra-400.woff2") format("woff2"); font-display: block; }
html { font-synthesis: none; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
#top, #bottom { position: absolute; left: 0; right: 0; height: 510px; background: #0d0907; }
#top { top: 0; background: radial-gradient(ellipse 760px 380px at 50% 100%, #2a1d14, #0d0907 75%); }
#bottom { bottom: 0; background: radial-gradient(ellipse 760px 380px at 50% 0%, #2a1d14, #0d0907 75%); }
#box { position: absolute; left: 0; right: 0; top: 510px; height: 900px; overflow: hidden; box-shadow: 0 0 60px rgba(0,0,0,.7); }
#frame { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; border: 0; transform-origin: 0 0; }
#fade { position: absolute; inset: 0; background: #000; pointer-events: none; opacity: 1; z-index: 2; }
#top .ttl { position: absolute; left: 0; right: 0; top: 150px; text-align: center; color: #f3ead6; font: 400 104px/0.98 "Ultra", Georgia, serif; letter-spacing: 5px; text-shadow: 0 7px 0 #000, 0 0 40px rgba(0,0,0,.7); }
</style>
</head>
<body>
<div id="top"><div class="ttl">DESPACHO<br>29-N</div></div>
<div id="bottom"></div>
<div id="box"><iframe id="frame" src="../index.html?demo=trailer"></iframe><div id="fade"></div></div>
<script>
/* Tráiler vertical 1080×1920, todo dentro del juego real y a ritmo legible.
   Los textos van en hojas del despacho. En las propuestas reales los sellos se reparten entre partidos.
   La cámara se mueve por JS fotograma a fotograma (sin transiciones CSS) para que el texto se repinte nítido. */
const frame = document.getElementById("frame"), fade = document.getElementById("fade");
const sl = (ms) => new Promise((r) => setTimeout(r, ms));
let t0 = 0; window.__events = []; window.__done = false; window.__ready = false;
const ev = (name, delay = 0) => window.__events.push({ t: Math.round(performance.now() - t0 + delay), name });

// ---- Cámara ----
// (cx, cy) en coordenadas del escenario 1280×720; k = píxeles de pantalla por píxel de escenario (k ≥ 2.67 llena el vertical).
const camState = { cx: 640, cy: 360, k: 2.8 };
// El juego va en una franja central de 1080×900 con zoom fijo; arriba va el título y abajo quedan 510 px libres para el enlace.
const BOX_W = 1080, BOX_H = 900, KFIX = 900 / 720;
function applyCam(c) {
  const k = Math.max(c.k, KFIX), hw = BOX_W / 2 / k, hh = BOX_H / 2 / k; // nunca menos zoom que llenar la franja
  const cx = Math.min(Math.max(c.cx, hw), 1280 - hw);
  const cy = hh * 2 >= 720 ? 360 : Math.min(Math.max(c.cy, hh), 720 - hh);
  frame.style.transform = `translate(${(BOX_W / 2 - cx * k).toFixed(2)}px, ${(BOX_H / 2 - cy * k).toFixed(2)}px) scale(${(k / 1.5).toFixed(4)})`;
}
const easeIO = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
let camAnim = 0;
function cam(cx, cy, k, ms = 0) {
  const id = ++camAnim, from = { ...camState }, s = performance.now();
  return new Promise((res) => {
    if (!ms) { Object.assign(camState, { cx, cy, k }); applyCam(camState); return res(); }
    (function step() {
      if (id !== camAnim) return res();
      const x = Math.min(1, (performance.now() - s) / ms), e = easeIO(x);
      camState.cx = from.cx + (cx - from.cx) * e; camState.cy = from.cy + (cy - from.cy) * e; camState.k = from.k + (k - from.k) * e;
      applyCam(camState);
      if (x < 1) requestAnimationFrame(step); else res();
    })();
  });
}
let fadeOp = 1;
function fadeTo(op, ms) {
  const o0 = fadeOp, s = performance.now();
  return new Promise((res) => (function step() {
    const x = Math.min(1, (performance.now() - s) / ms); fadeOp = o0 + (op - o0) * x; fade.style.opacity = fadeOp;
    if (x < 1) requestAnimationFrame(step); else res();
  })());
}
const ready = setInterval(() => { if (frame.contentWindow && frame.contentWindow.__G) { clearInterval(ready); window.__ready = true; } }, 50);

window.__start = async function () {
  const W = frame.contentWindow, doc = frame.contentDocument, G = W.__G;
  const st = doc.createElement("style");
  st.textContent = `#toast { display: none !important; }
    .paper.promo p { display: none; }
    .paper.promo h3 { line-height: 1.04; margin: 16px 0 0; overflow-wrap: normal; word-break: keep-all; hyphens: none; }`;
  doc.head.appendChild(st);
  t0 = performance.now();

  const D = 44;
  const center = (p) => [p._x + p.offsetWidth / 2, p._y + D + p.offsetHeight / 2];
  function tween(el, x, y, ms) {
    return new Promise((res) => {
      const x0 = el._x, y0 = el._y, s = performance.now();
      el.classList.add("dragging");
      (function step() {
        const k = Math.min(1, (performance.now() - s) / ms), e = easeIO(k);
        el._x = x0 + (x - x0) * e; el._y = y0 + (y - y0) * e; G.setPos(el);
        if (k < 1) requestAnimationFrame(step); else res();
      })();
    });
  }
  async function arrive(item, promo, settle = 600) {
    const job = { type: "single", item };
    G.S.queue = [job]; G.nextDoc(); ev("bell"); ev("slide", 350);
    await sl(360);
    // En vertical el papel entraría por la izquierda fuera de plano: lo dejamos caer desde arriba, dentro del encuadre.
    const el = job.el, tx = 470, ty = 115; // siempre centrado en el plano fijo
    el.classList.remove("anim"); el.style.transition = "none";
    el._x = tx; el._y = -480; el._r = el._base - 6; G.setPos(el); void el.offsetWidth;
    el.style.transition = "transform .5s cubic-bezier(.2,.9,.3,1)";
    el._x = tx; el._y = ty; el._r = el._base; G.setPos(el);
    setTimeout(() => (el.style.transition = ""), 520);
    await sl(20);
    if (promo) { job.el.classList.add("promo"); fitTitle(job.el); }
    await sl(settle); // que termine de deslizarse
    return job.el;
  }
  // Título lo más grande posible: cabe a lo ancho (sin partir palabras) y deja sitio abajo para la marca del sello
  function fitTitle(el) {
    const h3 = el.querySelector("h3");
    for (let f = 80; f >= 18; f -= 1) {
      h3.style.fontSize = f + "px";
      if (h3.scrollWidth <= h3.clientWidth + 0.5 && h3.offsetHeight <= 200 && el.offsetHeight <= 362) break;
    }
    h3.style.fontSize = (parseFloat(h3.style.fontSize) - 2) + "px"; // margen de seguridad respecto al borde
  }
  const textItem = (titulo, texto = "") => ({ id: "t", tema: "29-N", titulo, texto, partidos: [], eje: [0, 0], claro: "" });
  async function stamp(p, kind, ms = 520, dy = 225) {
    const s = G.stamps[kind];
    ev("grab");
    await tween(s, p._x + 75, p._y + dy - 75, ms);
    await sl(120);
    G.applyStamp(s, { x: p._x + 150, y: p._y + dy }); ev("stamp", 70);
    await sl(80);
  }
  async function pullCalendar() {
    const page = doc.querySelector("#cal-page"), r = page.getBoundingClientRect();
    const x0 = r.left + r.width / 2, y0 = r.top + r.height / 2;
    const fire = (tgt, type, x, y) => tgt.dispatchEvent(new W.PointerEvent(type, { bubbles: true, button: 0, pointerId: 7, clientX: x, clientY: y }));
    fire(page, "pointerdown", x0, y0); ev("grab");
    const s = performance.now(), dur = 700; let torn = false;
    await new Promise((res) => (function step() {
      const k = Math.min(1, (performance.now() - s) / dur), e = k * k;
      fire(W, "pointermove", x0 + 230 * e, y0 + 150 * e);
      if (!torn && doc.querySelector("#cal-page .cal-wd").textContent !== "Domingo") { torn = true; ev("tear"); }
      if (k < 1) requestAnimationFrame(step); else res();
    })());
    fire(W, "pointerup", x0 + 230, y0 + 150);
  }

  // ===== 0. La mesa, con la hoja del domingo =====
  G.S.day = -1; G.startDayCard(); G.strips(26); G.outbox(4);
  await cam(118, 345, 3.1); // empieza con zoom sobre el calendario
  await sl(200);
  await fadeTo(0, 600);
  await sl(400);

  // ===== 1. Arrancar la hoja =====
  await pullCalendar();
  await sl(300);
  ev("swish"); await cam(600, 360, 1, 1400); // se abre hasta el plano de la mesa

  // Plano fijo de la mesa: la cámara solo se mueve al cambiar de sitio.
  const MAIN = [600, 360, 1];
  const toMain = (ms = 450) => { ev("swish"); return cam(...MAIN, ms); };

  // Marca de sello directa (sin enseñar el gesto)
  async function mark(p, kind, dy = 235) {
    G.applyStamp(G.stamps[kind], { x: p._x + 150, y: p._y + dy }); ev("stamp", 70);
    await sl(100);
  }
  // Juego rápido: cae, se marca, sale volando
  async function rapido(id, kind) {
    const q = await arrive(G.findItem(id), null, 380);
    await sl(450);
    await mark(q, kind);
    await sl(250);
    G.sendOut(q); ev("whoosh");
    await sl(80);
  }
  // Hoja-guía: lo justo para leer el título
  async function guia(titulo, leer = 1400) {
    const g = await arrive(textItem(titulo), "promo", 450);
    await sl(leer);
    return g;
  }

  // ===== 2. Guía: la premisa =====
  let p = await guia("Propuestas reales. Sin nombres.", 1500);
  await mark(p, "ok", 300);
  await sl(250);
  G.sendOut(p); ev("whoosh");
  await sl(80);

  // ===== 3. Juego rápido =====
  await rapido("psoe-psicologo", "ok");
  await rapido("vox-zbe", "no");

  // ===== 4. Guía: la lupa =====
  p = await guia("¿No entiendes algo? Pásale la lupa.");
  await mark(p, "ok", 300); await sl(200); G.sendOut(p); ev("whoosh");
  p = await arrive(G.findItem("ppvox-cgpj"), null, 400);
  ev("grab"); await tween(G.lupa, p._x + 110, p._y + 70, 380);
  G.applyLupa({ x: p._x + 150, y: p._y + 120 }); ev("stick");
  ev("swish"); await cam(700, 360, 1, 550); // un solo paneo, para ver papel y pósit
  await sl(1700);
  await mark(p, "ok");
  await sl(200);
  G.sendOut(p); ev("whoosh");
  await toMain(450);
  await rapido("psoe-jets", "no");

  // ===== 5. Guía: la trituradora =====
  p = await guia("¿No lo tienes claro? A la trituradora.");
  ev("swish"); await cam(1280, 360, 1, 550);
  G.shred(p); ev("grab"); ev("shred", 300);
  await sl(1300);
  await toMain(500);

  // ===== 6. Juego rápido =====
  await rapido("fa-comedor", "ok");
  await rapido("pp-ministerios", "no");
  await sl(200);

  // ===== 7. Resultado: la brújula, sin revelar ganador =====
  await fadeTo(1, 300);
  doc.querySelectorAll("#papers .paper").forEach((x) => x.remove());
  let i = 0; G.S.results = [];
  W.SUELTAS.forEach((it) => G.S.results.push({ type: "single", item: it, verdict: ["ok", "no", "ok", "skip"][i++ % 4], day: i % 6 }));
  W.EXPEDIENTES.forEach((e, j) => G.S.results.push({ type: "dossier", exp: e, chosen: ["pp", "psoe", "vox", "fa", "psoe", "pp"][j], day: j }));
  G.S.day = 5; G.showEnd(); ev("flip");
  doc.querySelector("#end-winner").innerHTML = '<span style="color:#e8b04a">¿…?</span>';
  doc.querySelectorAll(".bar-fill").forEach((b) => (b.dataset.w = 50));
  doc.querySelectorAll(".bar-row > div:last-child").forEach((d) => (d.textContent = "¿?"));
  doc.querySelectorAll(".bar-row small").forEach((d) => (d.textContent = ""));
  doc.querySelector("#end-x").style.display = "none";
  [0, 1, 2, 3].forEach((k) => ev("tick", 600 + k * 350)); ev("bell", 2400);
  [0, 1, 2, 3].forEach((k) => ev("tick", 2900 + k * 250)); ev("stamp", 4200);
  await cam(590, 360, 1);
  await fadeTo(0, 300);
  await sl(3800);

  // ===== 8. Cierre =====
  await fadeTo(1, 300);
  const se = doc.querySelector("#screen-end"); se.style.transition = "none"; se.classList.add("hidden");
  await cam(...MAIN);
  await fadeTo(0, 300); ev("flip");
  p = await arrive(textItem("Juega gratis en itch.io"), "promo", 450);
  await sl(900);
  await mark(p, "ok", 300);
  await sl(1600);
  await fadeTo(1, 700);
  await sl(300);
  window.__done = true;
};
</script>
</body>
</html>
