<style>
@font-face { font-family: "Ultra"; src: url("../fonts/Ultra-400.woff2") format("woff2"); font-display: block; }
html { font-synthesis: none; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { overflow: hidden; background: #2a1d14; }
.scene { position: relative; overflow: hidden;
  background:
    radial-gradient(ellipse 60% 55% at 70% 20%, rgba(255,215,140,.25), transparent 70%),
    repeating-linear-gradient(90deg, rgba(0,0,0,.06) 0 2px, transparent 2px 30px),
    linear-gradient(180deg, #7d512f, #5a3820); }
.scene::after { content: ""; position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 150px rgba(0,0,0,.75); }
.grain { position: absolute; inset: 0; opacity: .3; background: repeating-radial-gradient(ellipse 700px 30px at 20% 70%, transparent 0 14px, rgba(40,22,10,.3) 14px 16px); }
.cover { width: 630px; height: 500px; }
.banner { width: 1920px; height: 480px; }
.portfolio { width: 1600px; height: 900px; }
.story { width: 1080px; height: 1920px; }
.story .grp { position: absolute; left: 0; top: 520px; width: 630px; height: 330px; transform: scale(1.714); transform-origin: 0 0; }

.paper { position: absolute; width: 250px; height: 320px; padding: 18px 20px; background: #f3ead6; border: 1px solid #c9bb9d;
  box-shadow: 0 4px 6px rgba(0,0,0,.3), 0 20px 36px rgba(0,0,0,.45); }
.paper .hd { height: 9px; width: 55%; background: #2b2520; opacity: .8; margin-bottom: 8px; }
.paper .rule { height: 3px; background: #2b2520; margin-bottom: 12px; }
.paper .red { height: 13px; width: 62%; background: #1b1714; margin-bottom: 18px; }
.paper .tt { height: 16px; width: 85%; background: #3a322a; opacity: .85; margin-bottom: 8px; border-radius: 2px; }
.paper .tt.s { width: 55%; margin-bottom: 18px; }
.paper .ln { height: 7px; background: rgba(43,37,32,.25); margin: 10px 0; }
.mark { position: absolute; width: 110px; height: 110px; padding: 14px; border: 6px solid currentColor; border-radius: 50%; mix-blend-mode: multiply; opacity: .85;
  -webkit-mask-image: repeating-linear-gradient(35deg, #000 0 3px, rgba(0,0,0,.7) 3px 5px); mask-image: repeating-linear-gradient(35deg, #000 0 3px, rgba(0,0,0,.7) 3px 5px); }
.ok { color: #2e7a3a; } .no { color: #b0251c; }
svg { width: 100%; height: 100%; display: block; }

.stamp { position: absolute; width: 150px; height: 120px; filter: drop-shadow(0 28px 18px rgba(0,0,0,.5)); }
.stamp .knob { position: absolute; left: 48px; top: 0; width: 54px; height: 38px; border-radius: 50% 50% 40% 40%; background: radial-gradient(circle at 40% 30%, #7a5640, #2e1d12); }
.stamp .neck { position: absolute; left: 64px; top: 34px; width: 22px; height: 22px; background: #3a2a1d; }
.stamp .base { position: absolute; left: 0; top: 54px; width: 150px; height: 50px; border-radius: 7px; color: #fff; padding: 6px 0; }
.stamp.g .base { background: linear-gradient(180deg, #44994f, #2b6a34); } .stamp.r .base { background: linear-gradient(180deg, #c03a30, #8a221c); }

.lupa { position: absolute; width: 140px; height: 140px; filter: drop-shadow(0 16px 12px rgba(0,0,0,.5)); }
.lupa .lens { position: absolute; left: 8px; top: 8px; width: 86px; height: 86px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.7), rgba(200,230,255,.2) 40%, rgba(160,200,230,.1) 70%); }
.lupa .rim { position: absolute; left: 0; top: 0; width: 102px; height: 102px; border-radius: 50%; border: 9px solid #c08f33; box-shadow: inset 0 0 0 2px #7d5a1c; }
.lupa .handle { position: absolute; left: 86px; top: 86px; width: 60px; height: 18px; border-radius: 6px; background: linear-gradient(180deg, #4a2f1c, #24160c); transform: rotate(45deg); transform-origin: 0 50%; }
.strip { position: absolute; width: 7px; height: 50px; background: #efe6d2; border-left: 1px solid #c5b89c; box-shadow: 0 3px 4px rgba(0,0,0,.3); }

.title { position: absolute; white-space: nowrap; color: #f3ead6; font: 400 64px/0.95 "Ultra", Georgia, serif; letter-spacing: 2px; text-shadow: 0 5px 0 #000, 0 0 30px rgba(0,0,0,.6); }
.band { position: absolute; left: 0; right: 0; background: linear-gradient(180deg, rgba(10,8,6,0), rgba(10,8,6,.9) 45%); }
.quad { position: absolute; width: 50%; height: 50%; opacity: .5; }
.v { display: none; }
body.v1 .v1, body.v2 .v2, body.v3 .v3, body.vbanner .vbanner, body.vstory .vstory, body.vportfolio .vportfolio { display: block; }
</style>
